version: "3.9"

services:
  predictor-api:
    build: .
    container_name: pl-predictor
    ports:
      - "8000:8000"
    volumes:
      # Persist data & models between container restarts
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
